spec:
  replicas:
    max: 6
  kafka:
    pool: nav-prod
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        tier: db-custom-1-3840
        name: spregulering
        databases:
          - name: spregulering
            envVarPrefix: DATABASE
        flags:
          - name: cloudsql.enable_pgaudit
            value: "on"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  env:
    - name: KAFKA_CONSUMER_GROUP_ID
      value: spregulering-v2
    - name: KAFKA_RESET_POLICY
      value: earliest
